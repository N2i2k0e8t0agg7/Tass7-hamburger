<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Service</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            Logo
        </div>
        <nav>
            <ul class="navlinks">
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <button class="usernamebtn" id="mobilenone">
            Username
        </button>
        <div class="hamburgercontainer">
            <button class="usernamebtn">
                Username
            </button>
            <button class="menubtn" aria-label="Open navigation menu" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="mobilemenu">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">About Us</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </header>
    <section class="hero">
        <div class="herotext">
            <h1>
                Revitalize Your Clothes with Expert
                <span>Laundry Services!</span>
            </h1>
            <p>
                From premium dry cleaning to swift wash and fold,
                we deliver care and convenience. Schedule a pickup
                and rediscover the freshness of your clothes today!
            </p>
            <button class="bookbtn">
                Book a service today!
            </button>
        </div>
        <div class="heroimage">
            <img src="image.png" alt="Laundry Image">
        </div>
    </section>
</body>

</html>
